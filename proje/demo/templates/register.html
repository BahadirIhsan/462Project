{% extends "base.html" %}
{% block title %}{{ _('nav_register') }}{% endblock %}
{% block body %}
<h1>{{ _('reg_title') }}</h1>
<p class="sub">{{ _('reg_sub', pw=cmu_password)|safe }}</p>
<div class="card" style="max-width:520px">
  <label for="u">{{ _('username') }}</label><input id="u" type="text" autocomplete="off" maxlength="32">
  <label for="p">{{ _('password') }}</label><input id="p" type="password" autocomplete="new-password">
  <label for="p2">{{ _('password2') }}</label><input id="p2" type="password" autocomplete="new-password">
  <label style="display:flex;gap:8px;align-items:flex-start;color:var(--ink)"><input id="c" type="checkbox" style="margin-top:4px">
  <span>{{ _('consent') }}</span></label>
  <div class="row" style="margin-top:14px"><button id="go">{{ _('reg_button') }}</button></div>
  <div class="msg" id="m"></div>
</div>
<script>
document.getElementById("go").onclick = async () => {
  const m = document.getElementById("m");
  const j = await post("/api/register", { username: u.value, password: p.value, password2: p2.value, consent: c.checked });
  if (j.ok) location = j.next; else { m.className = "msg err"; m.textContent = j.error; }
};
</script>
{% endblock %}
